name: sales-copilot
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      POSTGRES_DB: ${POSTGRES_DB:-sales_copilot}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run npm run env:init}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["app"]
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: ${API_NODE_ENV:-development}
      GATEWAY_URL: http://telegram-gateway:4101
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Run environment initializer}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-}
      AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      telegram-gateway: { condition: service_healthy }
    command: ["sh", "-c", "node scripts/migrate.mjs && exec node apps/api/dist/apps/api/src/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  telegram-gateway:
    profiles: ["app"]
    build:
      context: .
      target: telegram-gateway
    restart: unless-stopped
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Run environment initializer}
      SESSION_MASTER_KEY: ${SESSION_MASTER_KEY:?Run environment initializer}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      API_INTERNAL_URL: http://api:4000
    volumes: ["telegramdata:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    profiles: ["app"]
    build:
      context: .
      target: web
      args:
        INTERNAL_API_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
volumes:
  pgdata:
  redisdata:
  telegramdata:
